<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRICHIEO - Tampilan Aplikasi</title>
<style>
  body { margin: 0; padding: 24px; background: #f5f5f5; font-family: Arial, sans-serif; }
  header { max-width: 1100px; margin: 0 auto 24px; }
  h1 { color: #ff5252; margin: 0 0 4px; font-size: 26px; }
  p { color: #555; margin: 0; font-size: 14px; }
  .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; }
  img { width: 100%; max-width: 300px; border: 1px solid #ddd; border-radius: 8px; display: block; margin: 0 auto 10px; }
  figcaption { font-size: 13px; font-weight: bold; color: #333; }
</style>
</head>
<body>
  <header>
    <h1>PRICHIEO</h1>
    <p>Smart Tools for Small Business &middot; Tampilan aplikasi versi 1.2.0 dari build web Flutter dengan tema GTA6</p>
  </header>
  <div class="grid">
    <figure><img src="01-hpp.png" alt="Kalkulator HPP"><figcaption>1. Kalkulator HPP</figcaption></figure>
    <figure><img src="02-pemisah-kas.png" alt="Pemisah Kas"><figcaption>2. Pemisah Kas</figcaption></figure>
    <figure><img src="03-target.png" alt="Target Penjualan"><figcaption>3. Target Penjualan</figcaption></figure>
    <figure><img src="04-riwayat.png" alt="Riwayat"><figcaption>4. Riwayat</figcaption></figure>
    <figure><img src="05-about.png" alt="About"><figcaption>5. About</figcaption></figure>
  </div>
</body>
</html>
